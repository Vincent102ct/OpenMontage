 <radialGradient id="w-lamp"><stop stop-color="#e4b574" stop-opacity=".18"/><stop offset="1" stop-color="#e4b574" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="720" fill="url(#w-wall)"/>
