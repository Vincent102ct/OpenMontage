<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<!-- Fridge interior insert: the 2-litre bottle is about two thirds full (a third gone). -->
<defs>
 <linearGradient id="f-back" x2="0" y2="1"><stop stop-color="#e9eee4"/><stop offset="1" stop-color="#b9c5c0"/></linearGradient>
 <linearGradient id="f-water" x2="1"><stop stop-color="#7fb3c2" stop-opacity=".75"/><stop offset=".5" stop-color="#a7d3dc" stop-opacity=".7"/><stop offset="1" stop-color="#6fa3b3" stop-opacity=".75"/></linearGradient>
 <radialGradient id="f-glow" cx=".5" cy="0" r="1"><stop stop-color="#ffffff" stop-opacity=".35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="720" fill="url(#f-back)"/>
<rect width="1280" height="720" fill="url(#f-glow)"/>
<rect x="0" y="0" width="70" height="720" fill="#8d9c9c"/>
<rect x="1210" y="0" width="70" height="720" fill="#8d9c9c"/>
<path d="M 70 0 V 720 M 1210 0 V 720" stroke="#2a4048" stroke-width="5"/>
<!-- Glass shelves. -->
<path d="M 70 120 H 1210 M 70 610 H 1210" stroke="#9fb2b0" stroke-width="12"/>
<path d="M 70 616 H 1210" stroke="#ffffff" stroke-width="3" opacity=".6"/>
<!-- Neighbouring ordinary items, unchanged. -->
<g stroke="#1d303b" stroke-width="4" stroke-linejoin="round">
 <rect x="160" y="440" width="190" height="170" rx="14" fill="#c9d1cb"/>
 <path d="M 160 470 H 350" stroke="#9aa8a6" stroke-width="3"/>
 <rect x="900" y="470" width="120" height="140" rx="10" fill="#a28d68"/>
 <rect x="912" y="446" width="96" height="30" rx="6" fill="#716e57"/>
 <rect x="1060" y="520" width="110" height="90" rx="8" fill="#dcdccf"/>
</g>
<!-- 2 L PET bottle: cap, neck, ridged body; water level at about two thirds of the fillable height (y 236-606). -->
<g stroke="#1d303b" stroke-width="5" stroke-linejoin="round">
 <rect x="606" y="140" width="68" height="40" rx="8" fill="#52778c"/>
 <path d="M 612 180 H 668 V 200 Q 668 214 690 236 Q 712 258 712 290 V 586 Q 712 606 690 606 H 590 Q 568 606 568 586 V 290 Q 568 258 590 236 Q 612 214 612 200 Z" fill="#e8eff0" fill-opacity=".55"/>
</g>
<path d="M 572 362 H 708 V 586 Q 708 602 690 602 H 590 Q 572 602 572 586 Z" fill="url(#f-water)"/>
<path d="M 572 362 Q 640 355 708 362" fill="none" stroke="#5e95a6" stroke-width="4"/>
<path d="M 572 330 H 708 M 572 460 H 708 M 572 540 H 708" stroke="#9fb7bd" stroke-width="3" opacity=".7"/>
<rect x="572" y="410" width="136" height="70" fill="#e3e1d2" stroke="#1d303b" stroke-width="3"/>
<text x="640" y="458" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#2d4b5a">2L</text>
<path d="M 588 260 Q 584 420 592 580" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity=".55" fill="none"/>
<ellipse cx="640" cy="612" rx="90" ry="8" fill="#1d303b" opacity=".18"/>
</svg>
